# Webdis 内置 redis 持久化配置（覆盖官方镜像默认的 /tmp 非持久设置）
port 6379
bind 127.0.0.1

# 持久化目录（挂卷 webdis-data:/data）
dir /data

# AOF + RDB 双保险
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# 内存上限与淘汰策略
maxmemory 200mb
maxmemory-policy allkeys-lru

# 前台运行，由容器主进程管理
daemonize no
logfile ""
pidfile /data/redis.pid
