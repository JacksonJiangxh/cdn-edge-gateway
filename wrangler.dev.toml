# 本地开发专用配置（仅供 `npm run dev` 使用，不参与任何线上部署）
#
# 作用：给本地 dev 补一个 CDN_KV 绑定。
#   wrangler 会用 Miniflare 在 .wrangler/ 目录下模拟这个 KV 命名空间，
#   完全跑在本机，不需要 Cloudflare 账号，也不需要真实 namespace id。
#
# 为什么必须有：
#   网关的配置（站点、源站池、规则）全部存在 KV 里。
#   没有 CDN_KV 绑定时 getKV() 返回 null，登录和保存配置都会直接报 500。
#
# 线上部署不使用本文件：
#   `wrangler deploy` 只读根目录的 wrangler.toml，
#   生产的 KV 绑定请在控制台完成（见 docs/05-deploy-cli.md 步骤 2）。
#
# 清空本地数据：npm run dev -- --clean

name = "edge-cdn-dev"
main = "_worker.js"
# 兼容性日期必须与生产 wrangler.toml 保持一致，避免本地与生产运行时行为漂移。
# 2026-08-11 支持顶层 [cache] 字段（Workers Cache / Smart Cache），无需额外 flag；
# nodejs_compat 的 Node 兼容层稳定，支撑项目用到的 Stream/crypto/structuredClone 等 API。
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[vars]
# 不在此写死 ADMIN_PATH：留空让运行时缺省回退到代码默认 "__panel"，
# 同时允许通过 `npm run dev -- --admin-path xxx` 或环境变量 ADMIN_PATH 覆盖
# （dev.mjs 会以 --var 注入，wrangler 中 --var 优先级高于 toml [vars]）。
# 仅限本地 dev 使用；生产环境推荐「部署后管理面改 + 存 KV」，
# 部署脚本刻意不传该变量（见 wrangler.toml / gen-deploy-config.mjs）。

[assets]
directory = "dist/public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CDN_KV"
# 本地模拟无需真实 id，此处仅作占位标识。
id = "local-dev-kv"
