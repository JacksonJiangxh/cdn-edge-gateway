# 部署到 Cloudflare Pages —— 仅手动触发
#
# 【铁律】没有 push 触发器，只有 workflow_dispatch。
# 必须在 Actions 页面点「Run workflow」并填写确认串才会执行，杜绝误部署。
#
# 需要的仓库 Secret：
#   CLOUDFLARE_API_TOKEN   —— 需含 Cloudflare Pages:Edit 权限
#   CLOUDFLARE_ACCOUNT_ID
# 可选仓库 Variable：
#   CF_PAGES_PROJECT       —— Pages 项目名，默认 cdn-edge-gateway
#
# 部署后需在 Cloudflare 控制台（Pages → 设置 → 环境变量）补充【运行期环境变量】：
#   REDIS_URL      —— 必填（仅当不用 CF KV/R2/D1 时）。持久化后端，指向自建
#                     Webdis/Redis，形如 https://your-webdis.example.com。
#   ADMIN_PASSWORD —— 可选。首次初始化管理面密码。
#   JWT_SECRET     —— 可选但强烈建议。独立高熵密钥（≥8 位），用于登录态签名。
#   ADMIN_PATH     —— 可选。管理面入口前缀，不设用内置默认 __panel 兜底。
#   CLOUD_PLATFORM —— 可选。规范值 cf（构建期已烘焙进产物，可不设）。

name: 部署 Cloudflare Pages（手动）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认部署到线上请输入 deploy（防误触）'
        required: true
        type: string
        default: ''
      project_name:
        description: 'Pages 项目名（留空则用仓库变量 CF_PAGES_PROJECT）'
        required: false
        type: string
        default: ''
      branch:
        description: '目标分支：填 main 为正式环境，填其他值创建预览部署'
        required: true
        type: string
        default: 'main'

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到 Pages
    runs-on: ubuntu-latest
    steps:
      - name: 校验确认串
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "✗ 确认串不正确（需输入 deploy），已中止"
            exit 1
          fi
          echo "✓ 已确认，触发人: ${{ github.actor }}"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 缓存 Playwright 浏览器
        # 避免每次流水线重复下载 ~300MB 浏览器二进制；按 lock 文件哈希失效
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 安装依赖
        # postinstall 会确保 chromium 二进制就绪（缓存命中时秒过）
        run: npm ci

      - name: 安装浏览器系统依赖
        # build.mjs 的质量闸门含 Playwright 真实浏览器测试，必须保证可启动。
        # 该命令幂等，缺库时补齐，避免 "libglib-2.0.so.0: cannot open shared object file"。
        run: npx playwright install --with-deps chromium

      - name: 静态一致性检查
        run: npm run check

      - name: 构建（含产物自检）
        # ADMIN_PATH 是【纯运行时】变量，build 阶段不读取它（见 build.mjs）。
        # 管理面静态资源使用固定物理路径 /assets，与 ADMIN_PATH 解耦，
        # 改管理面入口前缀无需重新构建。部署用内置默认 __panel 兜底，
        # 部署后到管理面把入口前缀改成随机串并存进 KV（最高优先级生效）。
        run: npm run build

      - name: 校验凭据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "✗ 未配置 Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "✗ 未配置 Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "✓ 凭据就绪"

      # 说明：无需再单独注入 CLOUD_PLATFORM。
      # 构建期已由 build.mjs 的 esbuild define 把默认值 'cf' 烘焙进 _worker.js，
      # caps.js 读不到运行时变量时会用它兜底，故 Pages 零配置即可运行。
      - name: 发布到 Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_PROJECT: ${{ inputs.project_name }}
          VAR_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -e
          # 优先级：手动输入 > 仓库变量 > 默认值
          PROJECT="${INPUT_PROJECT:-${VAR_PROJECT:-cdn-edge-gateway}}"
          echo "项目: $PROJECT / 目标分支: ${{ inputs.branch }}"
          # 部署目录必须是仓库根，不能是 dist/public：
          # Pages 需要根目录的 _worker.js 承载数据面代理与 /__panel/api/*，
          # 只传 dist/public 会得到「静态页能开、API 全 404」的站点。
          npx wrangler pages deploy . \
            --project-name="$PROJECT" \
            --branch="${{ inputs.branch }}"
          echo "✓ Pages 部署完成（项目: $PROJECT）"

      - name: 部署摘要
        if: always()
        run: |
          {
            echo "### Cloudflare Pages 部署"
            echo ""
            echo "- 触发人：\`${{ github.actor }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 目标分支：\`${{ inputs.branch }}\`"
            echo "- 结果：\`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
