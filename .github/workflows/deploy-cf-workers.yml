# 部署到 Cloudflare Workers —— 仅手动触发
#
# 【铁律】没有 push 触发器，只有 workflow_dispatch。
# 必须在 Actions 页面点「Run workflow」并填写确认串才会执行，杜绝误部署。
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   —— 需含 Workers Scripts:Edit 权限
#   CLOUDFLARE_ACCOUNT_ID
#
# 部署后需在 Cloudflare 控制台（Workers → 设置 → 变量）补充【运行期环境变量】：
#   REDIS_URL      —— 必填（仅当不用 CF KV/R2/D1 时）。持久化后端，指向自建
#                     Webdis/Redis，形如 https://your-webdis.example.com。
#                     若不填且未绑定 CDN_KV/CDN_R2/CDN_DB，则配置无法保存。
#   ADMIN_PASSWORD —— 可选。首次初始化管理面密码；不设则首次访问按引导自行设置。
#   JWT_SECRET     —— 可选但强烈建议。独立高熵密钥（≥8 位），用于登录态签名；
#                     不设则 auth.js 拒绝签发令牌，登录不可用。
#   ADMIN_PATH     —— 可选。管理面入口前缀，不设用内置默认 __panel 兜底。
#   CLOUD_PLATFORM —— 可选。规范值 cf（构建期已烘焙进产物，可不设）。

name: 部署 Cloudflare Workers（手动）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认部署到线上请输入 deploy（防误触）'
        required: true
        type: string
        default: ''
      dry_run:
        description: '干跑模式：只校验不发布'
        required: true
        type: boolean
        default: false

# 禁止并发部署，避免两次发布互相覆盖
concurrency:
  group: deploy-cf-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到 Workers
    runs-on: ubuntu-latest
    steps:
      - name: 校验确认串
        # 二次确认：输入不是 deploy 就直接失败，防止手滑点了 Run workflow
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "✗ 确认串不正确（需输入 deploy），已中止"
            exit 1
          fi
          echo "✓ 已确认，触发人: ${{ github.actor }}"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 缓存 Playwright 浏览器
        # 避免每次流水线重复下载 ~300MB 浏览器二进制；按 lock 文件哈希失效
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 安装依赖
        # postinstall 会确保 chromium 二进制就绪（缓存命中时秒过）
        run: npm ci

      - name: 安装浏览器系统依赖
        # build.mjs 的质量闸门含 Playwright 真实浏览器测试，必须保证可启动。
        # 该命令幂等，缺库时补齐，避免 "libglib-2.0.so.0: cannot open shared object file"。
        run: npx playwright install --with-deps chromium

      - name: 静态一致性检查
        run: npm run check

      - name: 构建（含产物自检）
        # 必须先 build：wrangler.toml 的 assets 绑定会把 dist/public/ 作为 CF 静态资产
        # 上传，管理面静态资源（/{adminPath}/assets/*）由此命中边缘缓存、零函数额度。
        run: npm run build

      - name: 校验凭据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "✗ 未配置 Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "✗ 未配置 Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "✓ 凭据就绪"

      - name: 干跑校验（不发布）
        if: ${{ inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun
          echo "✓ 干跑通过，未发布到线上"

      - name: 生成临时部署配置（保留远程绑定/变量）
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          # 与 CNB 部署对齐（C6 修复）：先按 binding 名探测远程已绑定的
          # KV/R2/D1，动态生成 wrangler.deploy.toml，再部署。
          # 若探测失败（凭据缺失 / 网络错误 / 权限不足 / Worker 尚未部署），
          # 脚本会以非零退出码中止流水线，避免用空绑定清空线上配置。
          node scripts/gen-deploy-config.mjs

      - name: 发布到 Workers
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler deploy -c wrangler.deploy.toml
          rm -f wrangler.deploy.toml
          echo "✓ Workers 部署完成"

      - name: 部署摘要
        if: always()
        run: |
          {
            echo "### Cloudflare Workers 部署"
            echo ""
            echo "- 触发人：\`${{ github.actor }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 干跑：\`${{ inputs.dry_run }}\`"
            echo "- 结果：\`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
