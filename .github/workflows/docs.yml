name: 部署文档到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  # 允许手动触发
  workflow_dispatch:

# 允许 GITHUB_TOKEN 推送到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 MkDocs Material
        run: pip install -r docs-site/requirements.txt

      - name: 构建文档站
        run: mkdocs build -f docs-site/mkdocs.yml --strict

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
