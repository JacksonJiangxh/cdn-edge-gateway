# 构建校验 —— 只校验，绝不部署，且仅手动触发
#
# 【铁律】本仓库严禁任何自动触发。
#   本文件没有 push / pull_request 触发器，只有 workflow_dispatch。
#   即便是「只校验」的流水线，也一律由人工在 Actions 页面点 Run workflow 发起。
#   所有上线动作请走 deploy-*.yml（同样仅手动触发）。

name: 构建校验（手动）

on:
  workflow_dispatch:

# 重复触发时取消旧任务，省额度
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 构建与产物自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 缓存 Playwright 浏览器
        # 避免每次流水线重复下载 ~300MB 浏览器二进制；按 lock 文件哈希失效
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 安装依赖
        # postinstall 会确保 chromium 二进制就绪（缓存命中时秒过）
        run: npm ci

      - name: 安装浏览器系统依赖
        # build.mjs 的质量闸门含 Playwright 真实浏览器测试，必须保证可启动。
        # 该命令幂等，缺库时补齐，避免 "libglib-2.0.so.0: cannot open shared object file"。
        run: npx playwright install --with-deps chromium

      - name: 静态一致性检查
        # scripts/check.mjs：平台口径恒为规范值 cf|eo|esa + 自动生成入口可解析/可重建
        run: npm run check

      - name: 构建（含产物自检）
        # build.mjs 内置校验：产物完整性 + _worker.js 可被 import + 导出面正确
        run: npm run build

      - name: 端到端测试（登录/鉴权/后台 + 前端可执行性）
        # scripts/e2e-test.mjs：用产物 _worker.js 跑通「健康检查→管理面→登录→
        # /auth/me→/sites」完整链路，并在 Node 沙箱执行前端 JS 验证 window.API，
        # 拦截「构建成功但登录后进不去后台」这类运行时问题。
        run: npm run test:e2e

      - name: 单元测试
        run: |
          set -e
          if ls test/*.test.js >/dev/null 2>&1; then
            npm test
          else
            echo "跳过：test/ 下暂无用例"
          fi

      - name: 校验部署配置
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('edgeone.json','utf8'))" \
            && echo "✓ edgeone.json 合法 JSON"
          for f in "edge-functions/[[default]].js" wrangler.toml; do
            [ -f "$f" ] && echo "✓ 存在 $f" || { echo "✗ 缺失 $f"; exit 1; }
          done
