# 部署到阿里云 ESA Pages —— 仅手动触发
#
# 【铁律】没有 push / pull_request 触发器，只有 workflow_dispatch。
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   ESA_AK_ID          —— 阿里云 AccessKey ID（RAM 控制台创建，建议最小权限
#                          AliyunESAFullAccess 或自定义仅 ESA 读写）
#   ESA_AK_SECRET      —— 阿里云 AccessKey Secret
# 可选仓库 Variable：
#   ESA_PROJECT        —— ESA Pages 项目名，留空则用默认 cdn-edge-gateway
#
# 部署方式（二选一）：
#   A. 【流水线/本 workflow 采用】ESA 控制台连接 GitHub 仓库自动部署（推荐）：
#      在 ESA 控制台「边缘计算和 AI → 函数和 Pages → 新建 Pages → 连接 GitHub
#      仓库（根目录）」后，每次 push 主分支 ESA 会自动读 esa.jsonc 构建并部署。
#      此时本 workflow 只做「校验 + 构建 + 自检」的非交互流水线步骤，无需任何
#      Secret / 不调用 esa-cli（esa-cli login 需要交互，CI 内必失败）。
#   B. 【手动部署专用】本地 esa-cli 命令行：在你自己终端执行 esa-cli 登录后
#      commit + deploy。属于手动操作，不走本 workflow。
#
# 重要成本约束：阿里云 ESA 的 EdgeKV 按量收费且无免费额度，本项目在 ESA 上
# 统一禁用厂商 KV，持久化强制走外置 REDIS_URL（自建 Webdis/Redis）。
# 因此部署 ESA 前必须先在 ESA 控制台设置环境变量 REDIS_URL，否则运行时
# 配置无法保存（store.js requireKV 会报错）。该变量属运行期配置，不需进仓库。
#
# 部署目录说明：本项目部署的是仓库根目录，不是 dist/public。
#   ESA Pages 需要根目录的 esa.jsonc（指定 entry=./esa/index.js + assets.directory）
#   并自动托管 dist/public/ 静态资源。只传 dist/public 会得到「静态页能开、
#   API 全 404」的站点。

name: 部署阿里云 ESA Pages（手动）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认部署请输入 deploy（防误触）'
        required: true
        type: string
        default: ''
      env_target:
        description: '目标环境'
        required: true
        type: choice
        default: production
        options:
          - production
          - preview
      project_name:
        description: 'ESA Pages 项目名（留空用仓库变量 ESA_PROJECT）'
        required: false
        type: string
        default: ''

# 禁止并发部署，避免两次发布互相覆盖
concurrency:
  group: deploy-esa-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到阿里云 ESA Pages
    runs-on: ubuntu-latest
    steps:
      - name: 校验确认串
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "✗ 确认串不正确（需输入 deploy），已中止"
            exit 1
          fi
          echo "✓ 已确认，触发人: ${{ github.actor }} / 环境: ${{ inputs.env_target }}"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 缓存 Playwright 浏览器
        # 避免每次流水线重复下载 ~300MB 浏览器二进制；按 lock 文件哈希失效
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 安装依赖
        # postinstall 会确保 chromium 二进制就绪（缓存命中时秒过）
        run: npm ci

      - name: 安装浏览器系统依赖
        # build.mjs 的质量闸门含 Playwright 真实浏览器测试，必须保证可启动。
        # 该命令幂等，缺库时补齐，避免 "libglib-2.0.so.0: cannot open shared object file"。
        run: npx playwright install --with-deps chromium

      - name: 静态一致性检查
        run: npm run check

      - name: 构建（含产物自检）
        # ADMIN_PATH 等是【纯运行时】变量，build 阶段不读取（见 build.mjs）。
        # 管理面静态资源使用固定物理路径 /assets，与 ADMIN_PATH 解耦，
        # 改管理面入口前缀无需重新构建。
        run: npm run build

      - name: 校验外置 Redis 已配置提示
        # REDIS_URL 是 ESA 控制台运行期环境变量，CI 无法直接读取；此处仅作
        # 部署前提醒，真正的缺失检查在运行时 store.js requireKV 进行。
        run: |
          echo "── 部署前自检清单 ──"
          echo "• 已在 ESA 控制台设置环境变量 REDIS_URL（必填，ESA EdgeKV 收费禁用）"
          echo "• 可选：REDIS_TOKEN / REDIS_PREFIX / ADMIN_PASSWORD / JWT_SECRET"
          echo "• 可选：CLOUD_PLATFORM=esa（规范值；薄壳会强制补，可不设）"

      # 【流水线非交互】esa-cli 支持用环境变量 ESA_ACCESS_KEY_ID / ESA_ACCESS_KEY_SECRET
      # 跳过交互式 login（与官方「云效 Flow + ESA CLI」教程一致），故流水线可直接发布。
      # 发布目录必须是仓库根 `.`（含 esa.jsonc + dist/public），不能只传 dist/public。
      - name: 发布到 ESA Pages（esa-cli 非交互）
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_AK_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_AK_SECRET }}
          INPUT_PROJECT: ${{ inputs.project_name }}
          VAR_PROJECT: ${{ vars.ESA_PROJECT }}
        run: |
          set -e
          PROJECT="${INPUT_PROJECT:-${VAR_PROJECT:-cdn-edge-gateway}}"
          echo "项目: $PROJECT / 环境: ${{ inputs.env_target }}"
          [ -f esa.jsonc ] || { echo "✗ 缺少 esa.jsonc（ESA Pages 构建入口）"; exit 1; }
          [ -d dist/public ] || { echo "✗ 缺少 dist/public（构建产物）"; exit 1; }
          npm install -g esa-cli
          # 非交互登录：凭据来自上面注入的环境变量，无需人工输入
          esa-cli login
          echo "▸ 提交版本..."
          esa-cli commit
          echo "▸ 部署到边缘节点..."
          esa-cli deploy --name "$PROJECT" --assets .
          echo "✓ ESA Pages 部署完成（项目: $PROJECT）"
          echo "  记得在 ESA 控制台「环境变量」中设置 REDIS_URL 后才能保存配置。"

      - name: 部署摘要
        if: always()
        run: |
          {
            echo "### 阿里云 ESA Pages 部署"
            echo ""
            echo "- 触发人：\`${{ github.actor }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 环境：\`${{ inputs.env_target }}\`"
            echo "- 结果：\`${{ job.status }}\`"
            echo "- 注意：持久化依赖 ESA 控制台设置的 REDIS_URL（EdgeKV 收费，已禁用）"
          } >> "$GITHUB_STEP_SUMMARY"
