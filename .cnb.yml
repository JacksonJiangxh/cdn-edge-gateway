# ============================ 可复用片段（锚点定义） ============================
# 注意：锚点必须定义在被引用之前，故置于文件顶部。
.docker-image: &docker-image
  image: docker.cnb.cool/xzydm/mirrors/debian:13-all

.runner4: &runner4
  cpus: 4
  tags: cnb:arch:amd64

.runner2: &runner2
  cpus: 2
  tags: cnb:arch:amd64

# ---------------- 构建缓存 volumes ----------------
# 利用云原生构建的 Docker volumes 能力，把构建机目录 mount 进容器，
# 跨同构建机的多次流水线复用，免重复下载。覆盖三类环境部署产物：
#   1) node_modules              —— npm ci 装好的项目依赖（命中后 up to date 秒过）
#   2) /root/.npm                —— npm 本地缓存（加速 npm ci 与 npm install -g）
#   3) /var/cache/apt/archives    —— apt 下载的 .deb（setup-browser-deps 免联网下载）
#   4) /usr/local/lib/node_modules—— 全局包（esa-cli 等，ESA 按钮免 npm install -g）
# 说明：Playwright 的 chromium 二进制【不再挂卷】——它已固化进 docker:cache 镜像层
#   （/opt/playwright-browsers，见 cache.dockerfile），所有 stage 直接读镜像层、零下载。
#   此前挂 /root/.cache/ms-playwright 卷无效：该路径在 docker:cache 导出时被丢弃，跨 stage
#   的 copy-on-write 卷也不共享写层，反而空卷遮蔽镜像层内容，导致 build 阶段重下 300MB。
# 说明：volumes 缓存在「当前构建机」有效；构建机轮换则需重新预热（仍比纯裸跑快，
#      因为 apt/npm 缓存卷大概率仍在）。需要跨构建机/跨流水线稳定命中请改用 docker:cache 镜像。
# 远程开发（vscode 事件）刻意不挂此卷，保持纯净 debian 环境。
.docker-cache-vol: &docker-cache-vol
  volumes:
    - node_modules:copy-on-write
    - /root/.npm:copy-on-write
    - /var/cache/apt/archives:copy-on-write
    - /usr/local/lib/node_modules:copy-on-write

# ---------------- 依赖缓存镜像（docker:cache） ----------------
# 把环境部署整体烤进镜像（apt 库 + node_modules + chromium + esa-cli），
# 推到远端镜像源，跨构建机/跨流水线稳定命中（彻底免运行期 apt/npm/下载）。
# 与 volumes 并存时需注意：volumes 挂载点会覆盖容器内同路径，故 docker:cache 按钮
# 只用「精简版」volumes（纯网络加速项），不含 node_modules/全局包/chromium，
# 避免空卷遮蔽镜像内已固化的内容。chromium 已固化进 /opt/playwright-browsers 镜像层，不挂卷。
# 缓存镜像构建任务（每个启用镜像缓存的按钮 stages 首项）：
# 【关键】CNB 的 docker:cache 构建上下文 ONLY 包含 by 列表里的文件 + Dockerfile 本身，
#   未列出的文件在构建时「视为不存在」。故 cache.dockerfile 内 COPY 的上下文由 by 决定。
#
# 【矛盾与修复】by 同时承担「构建上下文白名单」与「重建触发条件」两职，原设计被迫把
#   scripts/*.mjs 逐文件塞进 by（postinstall 依赖 scripts/ensure-playwright-browsers.mjs），
#   导致「改脚本即重烤整镜像」且清单脆弱（新增脚本漏加即 MODULE_NOT_FOUND）。
#   修复：cache.dockerfile 改用 `npm ci --ignore-scripts` + 显式 `npx playwright install`
#   固化 chromium，构建上下文【不再需要 scripts/】，从而把 scripts/ 连同业务代码一起移出 by。
#   依据官方文档：npm ci 仅需 package.json + package-lock.json 即可装依赖，无需业务代码。
#
# 【当前 by 三件套】只含「环境依赖真相源」：
#   - package-lock.json / package.json：依赖树变化才需重建（versionBy 取 package-lock.json）；
#   - cache.dockerfile：Dockerfile 内容变化需重建。
#   业务代码（src/、web/、docs/）与 scripts/ 的改动【均不触发】镜像重建 —— 根治「改代码重烤镜像」。
#   新增脚本无需再改 by，消除脆弱清单维护。运行时各 stage 在完整仓库 checkout 上跑 postinstall，
#   探测 /opt 已固化的 chromium 秒过、零下载，行为不变。
.docker-cache-task: &docker-cache-task
  name: 构建依赖缓存镜像
  type: docker:cache
  options:
    dockerfile: cache.dockerfile
    by:
      - package-lock.json
      - package.json
      - cache.dockerfile
    versionBy:
      - package-lock.json
  exports:
    name: DOCKER_CACHE_IMAGE_NAME
# 引用缓存镜像（stage 级 image，供 build/install 等阶段复用）：
# env 显式声明浏览器缓存路径，与镜像层内 cache.dockerfile 固化值一致，
# 确保 postinstall（ensure-playwright-browsers.mjs）/ e2e（e2e-browser.mjs）读到同一目录。
# 即便容器继承镜像 ENV 也在此冗余声明，避免任何继承歧义。
.docker-cache-image: &docker-cache-image
  image: $DOCKER_CACHE_IMAGE_NAME
  env:
    PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
# docker:cache 按钮专用的精简 volumes（纯网络加速项）。
# 官方依据（https://docs.cnb.cool/zh/build/grammar.html DOCKER.VOLUMES）：
#   - copy-on-write 卷「并非实时跨 stage 共享可变写层」，且挂载点「会覆盖（遮蔽）容器内原有内容」。
#   - 官方结论：「二进制固化进镜像层后，不需要挂卷来提供本身」。
# 故 node_modules / 全局包（/usr/local/lib/node_modules）/ chromium（/opt/playwright-browsers）
# 均【不挂】——它们已固化在镜像层，挂载空卷反而遮蔽。chromium 此前曾挂 /root/.cache/ms-playwright
# 卷，但该卷跨 stage 不共享写层、且空卷遮蔽镜像层，导致 build 阶段重下 300MB。现固化进镜像层后，
# 不再依赖任何卷来传递浏览器二进制。
.docker-cache-image-vol: &docker-cache-image-vol
  volumes:
    - /root/.npm:copy-on-write
    - /var/cache/apt/archives:copy-on-write

# 密钥仓库地址。CNB 不支持仓库级 Secret 直填，凭据须放在独立的「密钥仓库」，
# 通过 imports 导入（详见 https://docs.cnb.cool/zh/repo/secret.html）。
# 地址可用环境变量 CNB_SECRET_ENVS 覆盖，未配置时回退默认路径。
# 密钥 yml 应包含（一份文件同时喂 CNB 与 GitHub，字段名两边一致）：
# ── 部署凭据（必须）──
#   CLOUDFLARE_API_TOKEN        —— CF API Token（Workers:Edit 或 Pages:Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID       —— CF 账户 ID
#   EO_SECRET                   —— EdgeOne API Token（EO Pages 控制台 → API Token 新建）
#   ESA_AK_ID                   —— 阿里云 AccessKey ID（RAM 控制台创建，建议最小权限）
#   ESA_AK_SECRET               —— 阿里云 AccessKey Secret
# ── 部署可选变量（留空则回退默认 cdn-edge-gateway，也可在按钮输入框覆盖）──
#   CF_PAGES_PROJECT            —— 可选，CF Pages 项目名
#   EO_PAGES_PROJECT            —— 可选，EO Pages 项目名
# ── 同步 GitHub 凭据（web_trigger_sync_github 按钮必须）──
#   GITHUB_TOKEN                —— GitHub Personal Access Token（需 repo 权限，用于 force push）
#   GITHUB_TARGET_REPO          —— GitHub 目标仓库地址，支持带/不带 https:// 前缀
#                                     （如 github.com/xzydm/cdn-edge-gateway.git 或
#                                      https://github.com/xzydm/cdn-edge-gateway.git）
#
# 注意：运行时业务变量（REDIS_URL / ADMIN_PASSWORD / JWT_SECRET 等）【不进密钥仓库】，
#       它们属于各厂商控制台的运行期「环境变量」，部署后到控制台设置即可（见下方各 stage 注释）。
.secret-envs: &secret-envs
  - https://cnb.cool/xzydm/xzsecret/-/blob/main/cdn-edge-gateway.yml

# ---------------- 浏览器测试系统依赖 ----------------
# 背景：build.mjs 的质量闸门包含 Playwright 真实浏览器测试（登录 → 进后台），
# 而 debian:13-all 是精简镜像，缺 libglib-2.0 / libnss3 等 chromium 运行所需共享库，
# 只下载浏览器二进制会以 "error while loading shared libraries" 启动失败。
# 【原则】不跳过测试，而是让流水线具备跑浏览器的能力。
# 这里在 npm ci 之前预装系统库：postinstall 随后下载二进制即可直接可用。
# 该步骤幂等；即使失败，scripts/e2e-browser.mjs 仍会在启动失败时自动补装重试。
# 【缓存优化】配合 docker:cache 镜像：镜像已固化全部系统库，so 探针直接命中跳过；
#   即便退回 volumes 模式（无镜像），命中 apt 缓存卷也跳过 apt-get update。
.setup-browser-deps: &setup-browser-deps
  <<: *docker-cache-image
  name: setup-browser-deps
  script: |
    set -e
    export DEBIAN_FRONTEND=noninteractive
    if [ -f /usr/lib/x86_64-linux-gnu/libnss3.so ] \
       && [ -f /usr/lib/x86_64-linux-gnu/libgbm.so.1 ]; then
      echo "✓ 系统共享库已就绪（缓存镜像/卷命中，跳过 apt）"
      exit 0
    fi
    echo "▸ 预装 chromium 运行所需系统共享库..."
    apt-get update -qq
    # 逐包安装并兼容 Debian 13 的 t64 改名（libasound2 → libasound2t64）
    for p in libglib2.0-0 libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
             libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libatspi2.0-0 \
             libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
             libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 \
             libudev1 fonts-liberation ca-certificates; do
      apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 \
        || apt-get install -y --no-install-recommends "${p}t64" >/dev/null 2>&1 \
        || echo "  ⚠ 跳过不可用包: $p"
    done
    echo "✓ 系统共享库就绪"

# ---------------- 校验步骤（仅手动校验按钮使用，绝不含部署） ----------------
# 全部 stage 跑在 docker:cache 镜像上（*docker-cache-image），install 从镜像
# 拷出 node_modules 让 npm ci 命中 up to date。首项 docker:cache 任务构建并导出镜像。
.ci-stages: &ci-stages
  - *docker-cache-task
  - *setup-browser-deps
  - name: install
    <<: *docker-cache-image
    # postinstall（scripts/ensure-playwright-browsers.mjs）探测到 /opt/playwright-browsers
    # 的 chromium 已就绪（镜像层固化），秒过、零下载；系统库也由镜像/cache 卷命中跳过 apt。
    script: |
      set -e
      # 从缓存镜像把依赖拷到工作区（命中则 npm ci 直接 up to date）
      cp -r "$NODE_PATH" ./node_modules 2>/dev/null || true
      npm ci
  - name: check
    <<: *docker-cache-image
    # 静态一致性检查（scripts/check.mjs）：CLOUD_PLATFORM 恒为 cf|eo|esa
    # + 自动生成前端入口可解析/可重建，与 GitHub Actions 的 ci.yml 对齐。
    script: npm run check
  - name: build
    <<: *docker-cache-image
    # build.mjs 内置产物自检（文件完整性 + _worker.js 可加载 + 导出面）
    script: npm run build
  - name: e2e
    <<: *docker-cache-image
    # scripts/e2e-test.mjs：用产物 _worker.js 跑通「健康检查→管理面→登录→鉴权→
    # 后台」完整链路 + Node 沙箱执行前端 JS 验证 window.API，拦截「构建成功但登录
    # 后进不去后台」这类运行时问题（与 GitHub Actions 的 ci.yml 对齐）。
    script: npm run test:e2e
  - name: test
    <<: *docker-cache-image
    script: |
      set -e
      if ls test/*.test.js >/dev/null 2>&1; then
        npm test
      else
        echo "跳过：test/ 下暂无用例"
      fi
  - name: verify-deploy-config
    <<: *docker-cache-image
    # 部署配置是纯文本，错了要到部署时才发现，这里提前静态校验
    script: |
      set -e
      node -e "JSON.parse(require('fs').readFileSync('edgeone.json','utf8'))" \
        && echo "✓ edgeone.json 合法 JSON"
      for f in edge-functions/'[[default]].js' wrangler.toml; do
        [ -f "$f" ] && echo "✓ 存在 $f" || { echo "✗ 缺失 $f"; exit 1; }
      done

# ============================ CI / CD 说明 ============================
# 【铁律】严禁任何自动触发。
#   本文件不存在 main / push / pull_request 等任何自动事件块，
#   所有流水线只能由仓库页面上的自定义按钮手动触发（web_trigger 事件），
#   按钮定义见 .cnb/web_trigger.yml。
#
# 产物说明（对齐本项目「双产物」构建）：
#   _worker.js    → 边缘函数，CF Workers / EO Edge Function / EO Cloud Function 共用
#   dist/public/  → 管理面静态资源，由边缘缓存托管
#
# 三个部署目标均从按钮发起：CF Workers / CF Pages / EO Pages。

# ============================ 兜底分支（$）：远程开发 + 手动部署 ============================
# YAML 顶层键不可重复，vscode 与所有 web_trigger_* 事件必须同处这一个 $ 块下。
$:
  # ---- vscode 事件：专供页面中启动远程开发用 ----
  vscode:
    - runner:
        <<: *runner4
      docker:
        <<: *docker-image
      imports: *secret-envs
      services:
        - docker
        - name: vscode
          options:
            onlyPreview: false
            launch: python keepalive.py
            keepAliveTimeout: 3600000
            daemon: true
            backup: false
      stages:
        # 镜像 debian:13-all 已预装 node24/npm11/git/curl/python3 等。
        # 依赖不自动安装：仅做环境体检并给出提示，由用户自行决策执行。
        - name: env-check
          script: |
            set -e
            echo "==> 当前工具链: node $(node -v) / npm $(npm -v) / git $(git --version)"
            if [ -d node_modules ]; then
              echo "✓ node_modules 已存在，可直接开发"
            else
              echo "⚠ node_modules 不存在（已从版本库移除，需本地安装）"
            fi
            echo ""
            echo "-------- 手动执行以下命令 --------"
            echo "  npm ci          # 按 package-lock.json 精确安装依赖"
            echo "  npm run build   # 生成 _worker.js"
            echo "  npm run dev     # 本地开发"
            echo "----------------------------------"
            echo "✓ 环境体检完成"

  # ---- 按钮：仅构建校验（不部署，可随时验产物） ----
  # 环境依赖由 docker:cache 镜像（ci-stages 首项）提供，故 job 级不再声明 docker/volumes。
  web_trigger_verify:
    - runner:
        <<: *runner2
      stages: *ci-stages

  # ---- 按钮：部署 Cloudflare Workers ----
  web_trigger_deploy_cf_workers:
    # 环境依赖由 docker:cache 镜像提供，job 级不声明 docker/volumes。
    - runner:
        <<: *runner2
      imports: *secret-envs
      stages:
        - *docker-cache-task
        - name: 确认手动触发
          <<: *docker-cache-image
          script: |
            echo "触发事件: $CNB_EVENT"
            echo "分支/提交: $CNB_BRANCH @ $CNB_COMMIT_SHORT"
            echo "目标: Cloudflare Workers"
            echo "干跑模式: ${dry_run:-false}"
        - *setup-browser-deps
        - name: install
          <<: *docker-cache-image
          script: |
            set -e
            cp -r "$NODE_PATH" ./node_modules 2>/dev/null || true
            npm ci
        - name: check
          <<: *docker-cache-image
          # 与 GitHub deploy-cf-workers.yml 对齐：build 前先做静态一致性检查
          script: npm run check
        - name: build
          <<: *docker-cache-image
          # ADMIN_PATH 是【纯运行时】变量，build 阶段不读取它（见 build.mjs）。
          # 管理面静态资源使用固定物理路径 /assets，与 ADMIN_PATH 解耦，
          # 改管理面入口前缀无需重新构建。部署用内置默认 __panel 兜底，
          # 部署后到管理面把入口前缀改成随机串并存进 KV（最高优先级生效）。
          # 必须先 build：wrangler.toml 的 assets 绑定会把 dist/public/ 作为 CF 静态资产
          # 上传，管理面静态资源由此命中边缘缓存、零函数额度（CF Workers 形态专属）。
          script: npm run build
        - name: 部署前自检清单
          <<: *docker-cache-image
          script: |
            echo "── 部署前自检清单（CF 控制台「变量」中设置）──"
            echo "• REDIS_URL（必填，不绑 KV/R2/D1 时）：指向自建 Webdis/Redis"
            echo "• ADMIN_PASSWORD（可选）/ JWT_SECRET（强烈建议，≥8 位）"
            echo "• ADMIN_PATH（可选，不设用默认 __panel）/ CLOUD_PLATFORM（可不设，构建期已烘焙）"
        - name: 校验凭据
          <<: *docker-cache-image
          script: |
            set -e
            [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "✗ 缺少 CLOUDFLARE_API_TOKEN（请检查密钥仓库）"; exit 1; }
            [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "✗ 缺少 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
            echo "✓ 凭据就绪"
        - name: 干跑校验（不发布）
          <<: *docker-cache-image
          if: |
            [ "$dry_run" = "true" ]
          script: |
            set -e
            set -o pipefail
            # 与正式发布一致：wrangler 会回显 bindings 真实资源 ID，脱敏后再打印
            redact() {
              sed -E \
                -e 's/\([0-9a-f]{32}\)/<redacted-kv-id>/g' \
                -e 's/\([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\)/<redacted-uuid>/g' \
                -e 's#https://[a-z0-9-]+\.(workers|pages)\.dev#<redacted-worker-url>#g' \
                -e 's/Current Version ID: [0-9a-f-]+/Current Version ID: <redacted-version-id>/g'
            }
            npx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun 2>&1 | redact
            echo "✓ 干跑通过，未发布到线上"
        - name: 生成临时部署配置（保留远程绑定/变量）
          <<: *docker-cache-image
          if: |
            [ "$dry_run" != "true" ]
          script: |
            set -e
            # 按 binding 名（CDN_KV/CDN_R2/CDN_DB，代码契约恒定）调用 CF API 拉取
            # 远程已绑定的真实配置（资源 id / 桶名 / 库名是用户自定义，原样保留），
            # 动态生成 wrangler.deploy.toml。ADMIN_PATH 刻意不传——部署后用内置默认
            # __panel 兜底，再于管理面改成随机串存 KV（最高优先级生效），避免变量页
            # 面出现该值误导小白。根 wrangler.toml 始终保持干净（不暴露资源 ID、不写死入口前缀）。
            node scripts/gen-deploy-config.mjs
        - name: 发布到 Workers
          <<: *docker-cache-image
          if: |
            [ "$dry_run" != "true" ]
          script: |
            set -e
            set -o pipefail
            # 脱敏函数：wrangler 默认会把 bindings 的真实资源 ID / 版本 ID / 子域名
            # 回显到 stdout，而上游 gen-deploy-config.mjs 的「隐藏」只作用于它自己的日志，
            # 管不到 wrangler 输出。故在此对 wrangler 的 stdout 做统一脱敏后再打印，
            # 避免隐私 ID 在发布阶段日志里再次暴露。
            redact() {
              sed -E \
                -e 's/\([0-9a-f]{32}\)/<redacted-kv-id>/g' \
                -e 's/\([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\)/<redacted-uuid>/g' \
                -e 's#https://[a-z0-9-]+\.(workers|pages)\.dev#<redacted-worker-url>#g' \
                -e 's/Current Version ID: [0-9a-f-]+/Current Version ID: <redacted-version-id>/g'
            }
            npx wrangler deploy -c wrangler.deploy.toml 2>&1 | redact
            rm -f wrangler.deploy.toml
            echo "✓ Workers 部署完成"

  # ---- 按钮：部署 Cloudflare Pages ----
  web_trigger_deploy_cf_pages:
    # 环境依赖由 docker:cache 镜像提供，job 级不声明 docker/volumes。
    - runner:
        <<: *runner2
      imports: *secret-envs
      stages:
        - *docker-cache-task
        - name: 确认手动触发
          <<: *docker-cache-image
          script: |
            echo "触发事件: $CNB_EVENT"
            echo "分支/提交: $CNB_BRANCH @ $CNB_COMMIT_SHORT"
            echo "目标: Cloudflare Pages"
        - *setup-browser-deps
        - name: install
          <<: *docker-cache-image
          script: |
            set -e
            cp -r "$NODE_PATH" ./node_modules 2>/dev/null || true
            npm ci
        - name: check
          <<: *docker-cache-image
          # 与 GitHub deploy-cf-pages.yml 对齐：build 前先做静态一致性检查
          script: npm run check
        - name: build
          <<: *docker-cache-image
          # ADMIN_PATH 是【纯运行时】变量，build 阶段不读取它（见 build.mjs）。
          # 管理面静态资源使用固定物理路径 /assets，与 ADMIN_PATH 解耦，
          # 改管理面入口前缀无需重新构建。部署用内置默认 __panel 兜底，
          # 部署后到管理面把入口前缀改成随机串并存进 KV（最高优先级生效）。
          script: npm run build
        - name: 部署前自检清单
          <<: *docker-cache-image
          script: |
            echo "── 部署前自检清单（CF Pages 控制台「环境变量」中设置）──"
            echo "• REDIS_URL（必填，不绑 KV/R2/D1 时）：指向自建 Webdis/Redis"
            echo "• ADMIN_PASSWORD（可选）/ JWT_SECRET（强烈建议，≥8 位）"
            echo "• ADMIN_PATH（可选，不设用默认 __panel）/ CLOUD_PLATFORM（可不设，构建期已烘焙）"
        - name: 校验凭据
          <<: *docker-cache-image
          script: |
            set -e
            [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "✗ 缺少 CLOUDFLARE_API_TOKEN（请检查密钥仓库）"; exit 1; }
            [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "✗ 缺少 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
            echo "✓ 凭据就绪"
        # 说明：无需再单独注入 CLOUD_PLATFORM。
        # 构建期已由 build.mjs 的 esbuild define 把默认值 'cf' 烘焙进 _worker.js，
        # caps.js 读不到运行时变量时会用它兜底，故 Pages 零配置即可运行。
        - name: 发布到 Pages
          <<: *docker-cache-image
          script: |
            set -e
            set -o pipefail
            # 优先级：按钮输入 > 密钥仓库变量 > 默认值
            PROJECT="${cf_pages_project:-${CF_PAGES_PROJECT:-cdn-edge-gateway}}"
            TARGET_BRANCH="${cf_pages_branch:-main}"
            echo "项目: $PROJECT / 目标分支: $TARGET_BRANCH"
            # 部署目录必须是仓库根，不能是 dist/public：
            # Pages 需要根目录的 _worker.js 承载数据面代理与 /__panel/api/*，
            # 只传 dist/public 会得到「静态页能开、API 全 404」的站点。
            # 脱敏：wrangler pages deploy 会回显部署 URL（含账号子域），过滤后再打印。
            redact() {
              sed -E \
                -e 's/\([0-9a-f]{32}\)/<redacted-kv-id>/g' \
                -e 's/\([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\)/<redacted-uuid>/g' \
                -e 's#https://[a-z0-9-]+\.(workers|pages)\.dev#<redacted-worker-url>#g' \
                -e 's/Current Version ID: [0-9a-f-]+/Current Version ID: <redacted-version-id>/g'
            }
            npx wrangler pages deploy . \
              --project-name="$PROJECT" \
              --branch="$TARGET_BRANCH" 2>&1 | redact
            echo "✓ Pages 部署完成（项目: $PROJECT）"

  # ---- 按钮：部署 EdgeOne Pages ----
  # 说明：CNB 官方支持直接对接 EO，用腾讯云提供的 tencentcom/deploy-eopages 镜像，
  #       镜像内置 edgeone CLI。部署步骤单独换镜像，故 imports 下沉到该 stage。
  web_trigger_deploy_eo_pages:
    # 环境依赖由 docker:cache 镜像提供（build 前阶段）；最后发布阶段切换 EO 官方镜像。
    - runner:
        <<: *runner2
      stages:
        - *docker-cache-task
        - name: 确认手动触发
          <<: *docker-cache-image
          script: |
            echo "触发事件: $CNB_EVENT"
            echo "分支/提交: $CNB_BRANCH @ $CNB_COMMIT_SHORT"
            echo "目标: EdgeOne Pages / 环境: ${eo_env:-preview}"
        - *setup-browser-deps
        - name: install
          <<: *docker-cache-image
          script: |
            set -e
            cp -r "$NODE_PATH" ./node_modules 2>/dev/null || true
            npm ci
        - name: check
          <<: *docker-cache-image
          # 与 GitHub deploy-eo-pages.yml 对齐：build 前先做静态一致性检查
          script: npm run check
        - name: build
          <<: *docker-cache-image
          # ADMIN_PATH 是【纯运行时】变量，build 阶段不读取它（见 build.mjs）。
          # 管理面静态资源使用固定物理路径 /assets，与 ADMIN_PATH 解耦，
          # 改管理面入口前缀无需重新构建。运行时在「环境变量」里配 ADMIN_PATH 即可。
          script: |
            npm run build
            # 本地构建即产出 EO「仅上传产物」部署包 dist-eo/（薄壳+_worker.js+静态资源
            # + 无 buildCommand 的精简 edgeone.json），后续发布 stage 直接上传、云端不重新构建。
            node scripts/package-eo.mjs
        - name: 部署前自检清单
          <<: *docker-cache-image
          script: |
            echo "── 部署前自检清单（EO 控制台「环境变量」中设置）──"
            echo "• REDIS_URL（必填，不用 EO KV 时）：指向自建 Webdis/Redis"
            echo "• ADMIN_PASSWORD（可选）/ JWT_SECRET（强烈建议，≥8 位）"
            echo "• ADMIN_PATH（可选，不设用默认 __panel）/ CLOUD_PLATFORM（可不设，薄壳补全）"
        - name: 发布到 EO Pages
          imports: *secret-envs
          <<: *docker-cache-image
          script: |
            set -e
            [ -n "$EO_SECRET" ] || { echo "✗ 缺少 EO_SECRET（请检查密钥仓库）"; exit 1; }
            # 优先级：按钮输入 > 密钥仓库变量 > 默认值
            PROJECT="${eo_pages_project:-${EO_PAGES_PROJECT:-cdn-edge-gateway}}"
            TARGET_ENV="${eo_env:-preview}"
            echo "项目: $PROJECT / 环境: $TARGET_ENV"

            # 【关键】对齐 Cloudflare 的「构建好只上传」语义：前面 build stage 已本地构建
            # 并处出 dist-eo/（薄壳+_worker.js+静态资源+无 buildCommand 的精简 edgeone.json），
            # 这里【只上传产物】、云端不再 npm install / npm run build，不消耗构建次数。
            # 兜底：若工作区未共享到 dist-eo（极少见的 stage 隔离），重新本地组装一次。
            if [ ! -f dist-eo/edgeone.json ]; then
              command -v node >/dev/null 2>&1 || { echo "✗ 缺少 dist-eo 且部署镜像无 node，无法兜底组装；请确认 build stage 已产出"; exit 1; }
              node scripts/package-eo.mjs
            fi

            # 官方标准 CLI：edgeone makers deploy（包名 edgeone，本地构建产物后上传，
            # 不消耗 EO 云端构建次数；云端构建次数仅在 Git 集成模式下才计）。
            # 非交互/CI 环境必须加 --json（见 edgeone-makers-tools skill），否则 stdout 带
            # 动画会被 runner 误判卡住；PAGES_SOURCE=skills 为官方要求的上下文变量。
            # 上传本地产物包 dist-eo/（含薄壳+_worker.js+静态资源+无 buildCommand 的精简
            # edgeone.json），CLI 直接上传、不再本地重新 build（npm run build 含 e2e 会退出）。
            export PAGES_SOURCE=skills
            npx -y edgeone@latest makers deploy dist-eo \
              -n "$PROJECT" \
              -t "$EO_SECRET" \
              -e "$TARGET_ENV" \
              --json
            echo "✓ EO Pages 部署完成（项目: $PROJECT / 环境: $TARGET_ENV，本地构建产物上传，未触发云端构建）"

  # ---- 按钮：部署阿里云 ESA Pages ----
  # 说明：CNB 此前缺 ESA Pages 按钮（GitHub 侧已有 deploy-esa-pages.yml），本次补齐对齐。
  #
  # 【流水线非交互】esa-cli 支持用环境变量 ESA_ACCESS_KEY_ID / ESA_ACCESS_KEY_SECRET
  # 跳过交互式 login（与官方「云效 Flow + ESA CLI」教程一致），故本按钮可直接发布，
  # 不再退回「控制台连接仓库自动部署」。变量来自密钥仓库的 ESA_AK_ID / ESA_AK_SECRET。
  #
  # 重要：阿里云 ESA 的 EdgeKV 按量收费且无免费额度，本项目在 ESA 上统一禁用厂商 KV，
  #       持久化强制走外置 REDIS_URL（自建 Webdis/Redis）。故发布前必须先在 ESA 控制台
  #       「环境变量」中设置 REDIS_URL，否则运行时 store.js requireKV 会报错、配置无法保存。
  #       该变量属运行期配置，不进密钥仓库、不进仓库。
  web_trigger_deploy_esa_pages:
    # 环境依赖（含全局 esa-cli）由 docker:cache 镜像提供，job 级不声明 docker/volumes。
    - runner:
        <<: *runner2
      imports: *secret-envs
      stages:
        - *docker-cache-task
        - name: 确认手动触发
          <<: *docker-cache-image
          script: |
            echo "触发事件: $CNB_EVENT"
            echo "分支/提交: $CNB_BRANCH @ $CNB_COMMIT_SHORT"
            echo "目标: 阿里云 ESA Pages / 环境: ${esa_env:-production}"
            echo "（流水线非交互：本步骤仅构建产物 + 自检，实际发布由 ESA 控制台连接仓库自动完成）"
        - *setup-browser-deps
        - name: install
          <<: *docker-cache-image
          script: |
            set -e
            cp -r "$NODE_PATH" ./node_modules 2>/dev/null || true
            npm ci
        - name: check
          <<: *docker-cache-image
          # 与 GitHub deploy-esa-pages.yml 对齐：build 前先做静态一致性检查
          script: npm run check
        - name: build
          <<: *docker-cache-image
          # ADMIN_PATH 等是【纯运行时】变量，build 阶段不读取（见 build.mjs）。
          script: npm run build
        - name: 部署前自检清单（流水线只读校验，发布在控制台）
          <<: *docker-cache-image
          script: |
            echo "── 部署前自检清单 ──"
            echo "• 已在 ESA 控制台设置环境变量 REDIS_URL（必填，ESA EdgeKV 收费已禁用）"
            echo "• 可选：REDIS_TOKEN / REDIS_PREFIX / ADMIN_PASSWORD / JWT_SECRET"
            echo "• 可选：CLOUD_PLATFORM=esa（薄壳会强制补，可不设）"
            echo "── 控制台自动部署是否已就绪？──"
            echo "• 在 ESA 控制台「边缘计算和 AI → 函数和 Pages → 新建 Pages → 连接 CNB 仓库（根目录）」"
            echo "  本按钮 push 后 ESA 会自动读 esa.jsonc 构建并部署。"
        - name: 发布到 ESA Pages（esa-cli 非交互）
          <<: *docker-cache-image
          # 非交互登录：凭据来自密钥仓库的 ESA_AK_ID / ESA_AK_SECRET，映射为 esa-cli 期望的环境变量
          script: |
            set -e
            [ -n "$ESA_AK_ID" ] || { echo "✗ 缺少 ESA_AK_ID（请检查密钥仓库）"; exit 1; }
            [ -n "$ESA_AK_SECRET" ] || { echo "✗ 缺少 ESA_AK_SECRET（请检查密钥仓库）"; exit 1; }
            # 优先级：按钮输入 > 密钥仓库变量 > 默认值
            PROJECT="${esa_pages_project:-${ESA_PROJECT:-cdn-edge-gateway}}"
            TARGET_ENV="${esa_env:-production}"
            [ -f esa.jsonc ] || { echo "✗ 缺少 esa.jsonc（ESA Pages 构建入口）"; exit 1; }
            [ -d dist/public ] || { echo "✗ 缺少 dist/public（构建产物）"; exit 1; }
            export ESA_ACCESS_KEY_ID="$ESA_AK_ID"
            export ESA_ACCESS_KEY_SECRET="$ESA_AK_SECRET"
            # esa-cli 已固化在缓存镜像内（/usr/local/lib/node_modules），直接可用
            command -v esa-cli >/dev/null 2>&1 || npm install -g esa-cli
            esa-cli login
            echo "▸ 提交版本..."
            esa-cli commit
            echo "▸ 部署到边缘节点... 项目: $PROJECT / 环境: $TARGET_ENV"
            esa-cli deploy --name "$PROJECT" --assets .
            echo "✓ ESA Pages 部署完成（项目: $PROJECT / 环境: $TARGET_ENV）"
            echo "  记得在 ESA 控制台「环境变量」中设置 REDIS_URL 后才能保存配置。"

  # ---- 按钮：把当前 commit 强制推送覆盖到 GitHub 仓库 ----
  # 作用：把 CNB 当前分支的 HEAD（当前 commit）强制推送到 GitHub 目标仓库，
  #       覆盖目标分支（force push）。用于「CNB 为主仓库、GitHub 为镜像」场景。
  # 凭据：来自密钥仓库的 GITHUB_TOKEN（GitHub Personal Access Token，需 repo 权限）
  #       与 GITHUB_TARGET_REPO（GitHub 仓库地址，如 github.com/xzydm/cdn-edge-gateway.git）。
  # 安全：两个变量来自密钥仓库（imports），不落库、不进版本库；force push 仅作用于
  #       目标 GitHub 仓库，不影响 CNB 仓库本身。要求 confirm=sync 二次确认防误触。
  # 变量优先级：按钮输入框 GITHUB_TARGET_REPO > 密钥仓库 GITHUB_TARGET_REPO。
  web_trigger_sync_github:
    - runner:
        <<: *runner2
      docker:
        <<: *docker-image
      imports: *secret-envs
      stages:
        - name: 确认手动触发
          script: |
            echo "触发事件: $CNB_EVENT"
            echo "分支/提交: $CNB_BRANCH @ $CNB_COMMIT_SHORT"
            echo "目标: 强制推送当前 commit 到 GitHub 仓库"
        - name: 校验凭据
          script: |
            set -e
            [ -n "$GITHUB_TOKEN" ] || { echo "✗ 缺少 GITHUB_TOKEN（请检查密钥仓库）"; exit 1; }
            [ -n "$GITHUB_TARGET_REPO" ] || { echo "✗ 缺少 GITHUB_TARGET_REPO（请检查密钥仓库）"; exit 1; }
            echo "✓ 凭据就绪"
        - name: 强制推送当前 commit 到 GitHub
          script: |
            set -e
            TARGET_BRANCH="${github_target_branch:-main}"
            # 归一化仓库地址：支持「github.com/x/foo.git」或「https://github.com/x/foo.git」两种填法
            TARGET_REPO="$GITHUB_TARGET_REPO"
            case "$TARGET_REPO" in
              https://*|http://*|git@*) ;;  # 已带协议，原样
              *) TARGET_REPO="https://$TARGET_REPO" ;;  # 缺前缀则自动补 https://
            esac
            # 注入 GitHub 凭证：https://x-access-token:<token>@github.com/... 避免明文落日志
            AUTH_REPO="$(echo "$TARGET_REPO" | sed -E 's#^(https?://)([^/]+)(/.*)$#\1x-access-token:\'"$GITHUB_TOKEN"'\@\2\3#')"
            echo "▸ 推送当前 commit ($CNB_COMMIT_SHORT) 到 $TARGET_REPO @ $TARGET_BRANCH（force）"
            git push --force "$AUTH_REPO" "HEAD:refs/heads/$TARGET_BRANCH"
            echo "✓ 已覆盖推送当前 commit 到 GitHub 仓库：$TARGET_REPO @ $TARGET_BRANCH"

  # ---- 按钮：清理历史流水线记录 ----
  # 目的：删除当前仓库的历史流水线构建日志，只保留最近 keep 条，避免日志堆积。
  # 依据 CNB OpenAPI（api.cnb.cool）：
  #   GET    /{repo}/-/build/logs        列出构建记录（GetBuildLogs，需 repo-cnb-history:r）
  #   DELETE /{repo}/-/build/logs/{sn}   删除指定构建日志（BuildLogsDelete，需 repo-cnb-trigger:rw）
  # 认证：Bearer CNB_TOKEN（CI 内置临时令牌，构建结束自动销毁，不落库、更安全）。
  # 安全：要求 confirm=clean 二次确认；只清理「当前这条以外的」历史旧记录，
  #       保留最近 keep 条，绝不删除正在运行的本次记录。
  web_trigger_cleanup_history:
    - runner:
        <<: *runner2
      docker:
        <<: *docker-image
      stages:
        - name: 确认手动触发
          script: |
            echo "触发事件: $CNB_EVENT"
            echo "分支/提交: $CNB_BRANCH @ $CNB_COMMIT_SHORT"
        - name: 二次确认
          script: |
            set -e
            if [ "${confirm:-}" != "clean" ]; then
              echo "✗ 确认串不正确（需输入 clean），已中止"
              exit 1
            fi
            echo "✓ 已确认清理"
        - name: 清理历史流水线记录
          script: |
            set -e
            : "${CNB_TOKEN:?缺少 CNB_TOKEN（CI 内置临时令牌），无法调用 OpenAPI}"
            KEEP="${keep:-50}"
            REPO_PATH="$CNB_REPO_SLUG_LOWERCASE"
            echo "仓库: $REPO_PATH / 保留最近 $KEEP 条"
            # 清理逻辑在独立脚本里（避免 YAML 块标量的 heredoc 缩进陷阱，便于维护与本地调试）
            python3 scripts/cleanup-cnb-history.py \
              --repo "$REPO_PATH" \
              --token "$CNB_TOKEN" \
              --keep "$KEEP"
            echo "✓ 清理完成"
